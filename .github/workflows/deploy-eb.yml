name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  EB_APPLICATION_NAME: ${{ vars.EB_APPLICATION_NAME || 'TicketHub Placeholder' }}
  EB_ENVIRONMENT_NAME: ${{ vars.EB_ENVIRONMENT_NAME || 'TicketHub-env ' }}
  EB_S3_BUCKET: ${{ vars.EB_S3_BUCKET }}

jobs:
  test-and-verify:
    name: Run E2E & Adversarial Verification Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run E2E integration tests
        run: npm test

      - name: Run Adversarial Auth & Concurrency Harness (44/44 checks)
        run: node tests/adversarial-harness.js

      - name: Restore clean seed data
        run: npm run seed

  deploy:
    name: Package & Deploy to Elastic Beanstalk
    environment: aws-secret
    needs: test-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Ensure clean seed data for initial deployment bundle
        run: |
          npm ci
          npm run seed

      - name: Ensure executable permissions on Elastic Beanstalk hooks
        run: chmod +x .platform/hooks/predeploy/01_persistent_storage.sh

      - name: Create Elastic Beanstalk deployment package
        run: |
          VERSION_LABEL="v-$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "VERSION_LABEL=${VERSION_LABEL}" >> $GITHUB_ENV
          zip -r "tickethub-${VERSION_LABEL}.zip" \
            server.js \
            package.json \
            package-lock.json \
            public \
            src \
            data/*.json \
            .ebextensions \
            .platform \
            -x "data/backups/*" "node_modules/*" "tests/*" ".git/*"

      - name: Configure AWS credentials manually
        run: |
          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/credentials
          echo "aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}" >> ~/.aws/credentials
          echo "aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> ~/.aws/credentials
          echo "aws_session_token = ${{ secrets.AWS_SESSION_TOKEN }}" >> ~/.aws/credentials
          echo "[default]" > ~/.aws/config
          echo "region = us-east-1" >> ~/.aws/config
      - name: Debug AWS credentials
        run: cat ~/.aws/credentials
      - name: Upload bundle to S3 & Deploy to Elastic Beanstalk
        run: |
          BUNDLE_FILE="tickethub-${VERSION_LABEL}.zip"
          S3_KEY="${EB_APPLICATION_NAME}/${BUNDLE_FILE}"

          echo "Uploading ${BUNDLE_FILE} to s3://${EB_S3_BUCKET}/${S3_KEY}..."
          aws s3 cp "${BUNDLE_FILE}" "s3://${EB_S3_BUCKET}/${S3_KEY}"
      
      - name: Create new application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${EB_APPLICATION_NAME}" \
            --version-label "${{ github.sha }}" \
            --source-bundle S3Bucket="${EB_S3_BUCKET}",S3Key="app-${{ github.sha }}.zip"

      - name: Deploy to Elastic Beanstalk environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${EB_ENVIRONMENT_NAME}" \
            --version-label "${{ github.sha }}"
      
