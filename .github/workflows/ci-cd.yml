
name: TicketHub CI/CD

# กำหนดเหตุการณ์ที่ทำให้ Pipeline ทำงาน
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# กำหนดสิทธิ์ที่จำเป็น
permissions:
  contents: read

jobs:

  # JOB 1: BUILD / CODE QUALITY
  build:
    name: Build and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Static Analysis
        run: npm run lint

  # JOB 2: TEST
  # Matrix ทำให้ Node.js 22 และ 24
  # ทำงานเป็นคนละ Job พร้อมกันได้
  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

  # JOB 3: DELIVERY GATE
  # ทำงานเมื่อ Build และ Test ผ่านทั้งหมด
  delivery:
    name: Delivery Ready
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Delivery confirmation
        run: echo "TicketHub passed CI and is ready for deployment."
