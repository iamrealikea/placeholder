<div class="container">
  <div class="row">
    <textarea id="file-source" class="col-md-12">const jwt = require(&#039;jsonwebtoken&#039;);
const UserModel = require(&#039;../models/user.model&#039;);

if (process.env.NODE_ENV === &#039;production&#039; &amp;&amp; (!process.env.JWT_SECRET || !process.env.JWT_SECRET.trim())) {
  throw new Error(&#039;FATAL: JWT_SECRET environment variable is required in production.&#039;);
}

const JWT_SECRET = (process.env.JWT_SECRET &amp;&amp; process.env.JWT_SECRET.trim()) || &#039;tickethub-secret-key-2026&#039;;

function signToken(user) {
  return jwt.sign(
    {
      id: user.id,
      email: user.email,
      role: user.role,
      name: user.name
    },
    JWT_SECRET,
    { expiresIn: &#039;7d&#039; }
  );
}

function sanitizeUser(user) {
  if (!user) return null;
  const { passwordHash, ...safe } = user;
  return safe;
}

function extractToken(req) {
  const authHeader = req.headers.authorization;
  if (authHeader &amp;&amp; authHeader.startsWith(&#039;Bearer &#039;)) {
    return authHeader.slice(7);
  }
  if (req.cookies &amp;&amp; req.cookies.tickethub_token) {
    return req.cookies.tickethub_token;
  }
  return null;
}

function optionalAuth(req, res, next) {
  const token = extractToken(req);
  if (!token) {
    req.user = null;
    return next();
  }
  try {
    const decoded = jwt.verify(token, JWT_SECRET);
    const user = UserModel.findById(decoded.id);
    req.user = user || null;
  } catch (_) {
    req.user = null;
  }
  return next();
}

function requireAuth(req, res, next) {
  const token = extractToken(req);
  if (!token) {
    return res.status(401).json({ error: &#039;Authentication required. Please log in.&#039; });
  }
  try {
    const decoded = jwt.verify(token, JWT_SECRET);
    const user = UserModel.findById(decoded.id);
    if (!user) {
      return res.status(401).json({ error: &#039;User account no longer exists.&#039; });
    }
    req.user = user;
    return next();
  } catch (err) {
    return res.status(401).json({ error: &#039;Invalid or expired session token.&#039; });
  }
}

function requireRole(roles = []) {
  return (req, res, next) =&gt; {
    requireAuth(req, res, () =&gt; {
      if (!roles.includes(req.user.role)) {
        return res.status(403).json({
          error: `Forbidden: requires role [${roles.join(&#039;, &#039;)}]`
        });
      }
      return next();
    });
  };
}

module.exports = {
  JWT_SECRET,
  signToken,
  sanitizeUser,
  optionalAuth,
  requireAuth,
  requireRole
};
