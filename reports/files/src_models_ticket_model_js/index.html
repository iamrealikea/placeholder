<div class="container">
  <div class="row">
    <textarea id="file-source" class="col-md-12">const { v4: uuidv4 } = require(&#039;uuid&#039;);
const QRCode = require(&#039;qrcode&#039;);
const { store } = require(&#039;../store/jsonStore&#039;);

class TicketModel {
  static findAll() {
    return store.getAll(&#039;tickets&#039;);
  }

  static findByUserId(userId) {
    const tickets = store
      .find(&#039;tickets&#039;, (t) =&gt; t.userId === userId)
      .map((t, index) =&gt; ({ t, index }));
    tickets.sort((a, b) =&gt; {
      const timeDiff = new Date(b.t.createdAt || 0).getTime() - new Date(a.t.createdAt || 0).getTime();
      return timeDiff !== 0 ? timeDiff : b.index - a.index;
    });
    return tickets.map((item) =&gt; item.t);
  }

  static findByBookingId(bookingId) {
    return store.find(&#039;tickets&#039;, (t) =&gt; t.bookingId === bookingId);
  }

  static findByLookupCode(lookupCode) {
    if (!lookupCode) return null;
    const raw = String(lookupCode).trim();
    const upper = raw.toUpperCase();
    return store.findOne(
      &#039;tickets&#039;,
      (t) =&gt;
        t.ticketCode.toUpperCase() === upper ||
        t.id === raw ||
        t.qrPayload === raw ||
        (raw.startsWith(&#039;data:image/&#039;) &amp;&amp; t.qrDataUrl === raw)
    );
  }

  static async issueForBooking(booking, seats, holderNames) {
    const issuedTickets = [];
    for (const [index, s] of seats.entries()) {
      const holderName = holderNames[index];
      const ticketCode = `TKT-${booking.id.slice(-4).toUpperCase()}-${s.seatNumber}-${Math.round(Math.random() * 1e4)}`;
      const qrPayload = JSON.stringify({
        ticketCode,
        bookingId: booking.id,
        eventId: booking.eventId,
        roundId: booking.roundId,
        seatNumber: s.seatNumber,
        holder: holderName
      });

      const qrDataUrl = await QRCode.toDataURL(qrPayload, {
        width: 320,
        margin: 1,
        color: { dark: &#039;#000000&#039;, light: &#039;#FFFFFF&#039; }
      });

      const ticketItem = {
        id: `tkt-${uuidv4().slice(0, 8)}`,
        ticketCode,
        bookingId: booking.id,
        userId: booking.userId,
        eventId: booking.eventId,
        eventTitle: booking.eventTitle,
        holderName,
        venue: booking.venue,
        roundId: booking.roundId,
        roundLabel: booking.roundLabel,
        seatId: s.id,
        seatNumber: s.seatNumber,
        zoneName: s.zoneName,
        price: s.price,
        qrPayload,
        qrDataUrl,
        status: &#039;VALID&#039;,
        checkedInAt: null,
        checkedInBy: null,
        createdAt: new Date().toISOString()
      };
      store.insert(&#039;tickets&#039;, ticketItem);
      issuedTickets.push(ticketItem);
    }
    return issuedTickets;
  }

  static checkIn(ticketId, staffName) {
    return store.update(&#039;tickets&#039;, ticketId, {
      status: &#039;CHECKED_IN&#039;,
      checkedInAt: new Date().toISOString(),
      checkedInBy: staffName || &#039;Gate Staff&#039;
    });
  }

  static cancelByBookingId(bookingId) {
    const tickets = this.findByBookingId(bookingId);
    for (const t of tickets) {
      if (t.status !== &#039;CHECKED_IN&#039;) {
        t.status = &#039;CANCELLED&#039;;
      }
    }
    store.save(&#039;tickets&#039;);
    return tickets;
  }
}

module.exports = TicketModel;
