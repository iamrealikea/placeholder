<div class="container">

    <textarea id="file-source" class="col-md-12">const express = require(&#039;express&#039;);
const { requireAuth } = require(&#039;../middleware/auth&#039;);
const { uploadAvatarMiddleware } = require(&#039;../middleware/upload&#039;);
const authController = require(&#039;../controllers/auth.controller&#039;);

const router = express.Router();

router.post(&#039;/register&#039;, authController.register);
router.post(&#039;/login&#039;, authController.login);
router.get(&#039;/social-config&#039;, authController.getSocialConfig);
router.post(&#039;/social-login&#039;, authController.socialLogin);
router.post(&#039;/logout&#039;, authController.logout);

router.get(&#039;/me&#039;, requireAuth, authController.getMe);
router.get(&#039;/profile&#039;, requireAuth, authController.getProfile);
router.put(&#039;/profile&#039;, requireAuth, authController.updateProfile);
router.post(&#039;/avatar&#039;, requireAuth, uploadAvatarMiddleware, authController.uploadAvatar);

module.exports = router;</textarea>
